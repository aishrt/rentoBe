# Deploys the API on every push to master or staging (plan §13.3): lint, typecheck, test and build, then
# build the Docker image, push it to ECR, register a task definition revision with it, sync the database
# indexes with a one-off task of that revision, and roll it out to ECS.
# There is one API, shared by www.rentovroom.com and staging.rentovroom.com (the owner's choice,
# 1 October 2026): a push to staging puts that code on the live API too, so API changes stay additive and
# the live website must keep working with them. Merging staging into master afterwards redeploys it.
# Pull requests into master or staging (including Dependabot's) run the checks only; they never deploy.
#
# AWS access uses GitHub's OIDC login and the IAM role rento-vroom-github-backend, which trusts only
# pushes to master and staging of aishrt/rentoBe. No AWS keys are stored in GitHub.
# Task settings (environment, secrets, CPU, memory) come from deploy/taskdef.prod.json; the pipeline only
# replaces its image with the one it just built.
name: Deploy backend

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it.
# A pull request's checks run on their own, and a newer commit to it cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'deploy-backend-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  AWS_ROLE_ARN: arn:aws:iam::935937182366:role/rento-vroom-github-backend
  ECR_REGISTRY: 935937182366.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY: rento-vroom-backend
  ECS_CLUSTER: rento-vroom
  ECS_SERVICE: api-prod
  TASK_DEFINITION_FILE: deploy/taskdef.prod.json
  # The API service's private subnets and security group, for the one-off index sync task.
  TASK_SUBNETS: subnet-0aca9a8e6581aa2ab,subnet-03dc466f01d257240
  TASK_SECURITY_GROUP: sg-07f10da5516b3bc7a
  API_URL: https://api.rentovroom.com

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Build and deploy to ECS
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push the image
        id: image
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$(git rev-parse --short HEAD)"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker build --build-arg RELEASE="rento-vroom-backend@$(git rev-parse --short HEAD)" -t "$image" .
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Register a task definition revision with the new image
        id: taskdef
        run: |
          jq --arg image "${{ steps.image.outputs.uri }}" '.containerDefinitions[0].image = $image' \
            "$TASK_DEFINITION_FILE" > taskdef.json
          arn=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "Registered $arn"

      # Production doesn't build indexes when it starts (src/db.ts), so the new version's are created here,
      # before it takes traffic (plan §3, §13.3). The task runs in the private subnets and reaches Atlas
      # through the NAT gateway like the API; the pipeline itself never connects to the database.
      - name: Sync database indexes
        env:
          TASK_DEFINITION_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          task=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION_ARN" --started-by sync-indexes \
            --network-configuration "awsvpcConfiguration={subnets=[$TASK_SUBNETS],securityGroups=[$TASK_SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","--enable-source-maps","dist/sync-indexes.js"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$task" ] || [ "$task" = "None" ]; then
            echo "::error::ECS didn't start the index sync task."
            exit 1
          fi
          echo "Started $task"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          read -r code reason <<< "$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" \
            --query 'tasks[0].[containers[0].exitCode,stoppedReason]' --output text)"
          if [ "$code" != "0" ]; then
            echo "::error::The index sync failed (exit code $code: $reason), so the new version wasn't rolled out. See its log in /ecs/rento-vroom-api-prod."
            exit 1
          fi
          echo "Indexes are in sync."

      # ECS starts the new containers, waits for their health checks, then drains the old ones. The
      # circuit breaker replaces a version that never becomes healthy with the previous one (a rollback).
      - name: Roll out and wait until the new version is running
        env:
          TASK_DEFINITION_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" --query service.serviceName --output text
          # The new deployment can take a few seconds to show up, so poll its own state rather than
          # waiting for the service to look stable (it still does, briefly, with only the old version).
          seen=false
          for attempt in $(seq 1 90); do # 90 x 10 s = 15 minutes; a rollout usually takes 3-5
            read -r primary state <<< "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[taskDefinition,rolloutState]" --output text)"
            if [ "$primary" = "$TASK_DEFINITION_ARN" ]; then
              seen=true
              case "$state" in
                COMPLETED) echo "Running: $TASK_DEFINITION_ARN"; exit 0 ;;
                FAILED) break ;;
              esac
            elif [ "$seen" = true ]; then
              break # replaced by the previous version: ECS rolled back
            fi
            sleep 10
          done
          echo "::error::The new version did not become the running one (primary: $primary, $state). Check the CloudWatch logs in /ecs/rento-vroom-api-prod."
          exit 1

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$API_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null \
            "$API_URL/pages/sitemap.xml"
